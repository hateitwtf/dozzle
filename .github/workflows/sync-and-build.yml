name: Sync upstream, pull icons, and build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Собрать образ даже если нет обновлений'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest upstream release and sync
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Получаем последний официальный релиз из amir20/dozzle
          LATEST_TAG=$(gh api repos/amir20/dozzle/releases/latest --jq .tag_name)
          echo "Latest upstream release tag: $LATEST_TAG"
          echo "release_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # 2. Подтягиваем актуальные теги из origin
          git fetch origin --tags --force

          # 3. Проверяем, существует ли уже такой тег в origin
          if git rev-parse "refs/tags/$LATEST_TAG" >/dev/null 2>&1; then
            echo "Release $LATEST_TAG is already synced."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release found: $LATEST_TAG. Merging..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git remote add upstream https://github.com/amir20/dozzle.git || true
            git fetch upstream tag "$LATEST_TAG" --no-tags

            git merge "$LATEST_TAG" --no-edit -m "chore: sync release $LATEST_TAG"

            # Ставим/обновляем тег принудительно (-f) и пушим
            git tag -f "$LATEST_TAG"
            git push origin master
            git push origin "$LATEST_TAG" --force

            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine if build is needed
        id: check_run
        run: |
          if [ "${{ steps.sync.outputs.has_updates }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download extra icons from homarr-labs and selfhst
        if: steps.check_run.outputs.run_build == 'true'
        run: |
          mkdir -p assets/icons/apps

          # 1. Скачиваем homarr-labs/dashboard-icons
          echo "Fetching homarr-labs/dashboard-icons..."
          git clone --depth 1 --branch main --filter=blob:none --sparse https://github.com/homarr-labs/dashboard-icons.git /tmp/homarr
          cd /tmp/homarr
          git sparse-checkout set svg
          cd -

          # 2. Скачиваем selfhst/icons
          echo "Fetching selfhst/icons..."
          git clone --depth 1 --branch main --filter=blob:none --sparse https://github.com/selfhst/icons.git /tmp/selfhst
          cd /tmp/selfhst
          git sparse-checkout set svg
          cd -

          # Функция безопасного копирования с фильтрацией light/dark
          process_icons() {
            local src_dir="$1"
            shopt -s nullglob
            for file in "$src_dir"/*.svg; do
              [ -f "$file" ] || continue
              filename=$(basename "$file")
              lower_name=$(echo "$filename" | tr '[:upper:]' '[:lower:]')

              # Игнорируем и пропускаем любые темы -light и -dark
              if [[ "$lower_name" == *"-light.svg"* ]] || [[ "$lower_name" == *"-dark.svg"* ]]; then
                continue
              fi

              # Копируем оригинальное имя
              cp -f "$file" "assets/icons/apps/$lower_name"

              # Если есть суффикс -svg.svg, создаем копию с чистым именем (dockhand-svg.svg -> dockhand.svg)
              if [[ "$lower_name" == *"-svg.svg"* ]]; then
                clean_name="${lower_name/-svg.svg/.svg}"
                cp -f "$file" "assets/icons/apps/$clean_name"
              fi
            done
            shopt -u nullglob
          }

          echo "Processing homarr icons..."
          process_icons "/tmp/homarr/svg"

          echo "Processing selfhst icons..."
          process_icons "/tmp/selfhst/svg"

          echo "Icons total: $(ls -1 assets/icons/apps/*.svg | wc -l)"

          # Сворачиваемый лог итогового списка иконок
          echo "::group::Final list of bundled icons"
          ls -1 assets/icons/apps/*.svg | sed 's|assets/icons/apps/||'
          echo "::endgroup::"

      - name: Save icons list as artifact
        if: steps.check_run.outputs.run_build == 'true'
        run: |
          ls -1 assets/icons/apps/*.svg | sed 's|assets/icons/apps/||' | sort > icons-list.txt

      - name: Upload icons list
        if: steps.check_run.outputs.run_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundled-icons-list
          path: icons-list.txt
          retention-days: 7

      - name: Generate valid self-signed shared cert and key
        if: steps.check_run.outputs.run_build == 'true'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout shared_key.pem \
            -out shared_cert.pem \
            -days 3650 \
            -subj "/CN=dozzle-internal"

      - name: Log in to GitHub Container Registry
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.check_run.outputs.run_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dozzle-iconful
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sync.outputs.release_tag }}

      - name: Set up Docker Buildx
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
