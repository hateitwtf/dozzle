name: Sync upstream, pull icons, and build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Собрать образ даже если нет обновлений'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream master
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/amir20/dozzle.git || true
          git fetch upstream master

          BEHIND_COUNT=$(git rev-list HEAD..upstream/master --count)
          echo "Behind upstream by $BEHIND_COUNT commits"

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "Merging upstream changes..."
            git merge upstream/master --no-edit -m "chore: sync upstream master"
            git push origin master
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "Up to date."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine if build is needed
        id: check_run
        run: |
          if [ "${{ steps.sync.outputs.has_updates }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download extra icons from homarr-labs/dashboard-icons
        if: steps.check_run.outputs.run_build == 'true'
        run: |
          echo "Fetching dashboard-icons..."
          git clone --depth 1 --branch main --filter=blob:none --sparse https://github.com/homarr-labs/dashboard-icons.git /tmp/icons
          cd /tmp/icons
          git sparse-checkout set svg
          cd -
          mkdir -p assets/icons/apps
          cp -n /tmp/icons/svg/*.svg assets/icons/apps/
          echo "Icons total: $(ls -1 assets/icons/apps/*.svg | wc -l)"

      - name: Generate valid self-signed shared cert and key
        if: steps.check_run.outputs.run_build == 'true'
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout shared_key.pem \
            -out shared_cert.pem \
            -days 3650 \
            -subj "/CN=dozzle-internal"

      - name: Log in to GitHub Container Registry
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.check_run.outputs.run_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: steps.check_run.outputs.run_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
